crds:
  enabled: false

# Disable EKS-managed control plane components
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

# Keep CoreDNS and Kubelet (these run on your worker nodes)
coreDns:
  enabled: true
kubelet:
  enabled: true

# Alertmanager config fix for internal TLS + AlertmanagerConfig CRD discovery
alertmanager:
  enabled: true
  alertmanagerSpec:
    nodeSelector:
      workload-tier: t3-medium-monitoring
    tolerations:
      - key: workload
        operator: Equal
        value: t3-medium-monitoring
        effect: NoSchedule
    webConfig:
      tlsConfig: null
    alertmanagerConfigSelector:
      matchLabels:
        release: kube-prometheus-stack
    alertmanagerConfigNamespaceSelector: {}
    alertmanagerConfigMatcherStrategy:
      type: None

# 1. Grafana configuration + Ingress
grafana:
  enabled: true
  sidecar:
    dashboards:
      provider:
        allowUiUpdates: true
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 256Mi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  nodeSelector:
    workload-tier: t3-medium-monitoring
  tolerations:
    - key: workload
      operator: Equal
      value: t3-medium-monitoring
      effect: NoSchedule
  serviceAccount:
    create: true
    name: "kube-prometheus-stack-grafana"
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::255945442255:role/group2-capstone-grafana-cloudwatch-role"
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.logging.svc.cluster.local:80
      jsonData:
        maxLines: 1000
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo.logging.svc.cluster.local:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: 'Loki'
          spanStartTimeShift: '1h'
          spanEndTimeShift: '1h'
          filterByTraceID: false
          filterBySpanID: false
          customQuery: true
          query: '{app="%s"} |= "%s"'
    - name: CloudWatch
      type: cloudwatch
      # authType "default" tells Grafana to use the EKS IAM Role
      jsonData:
        authType: default
        defaultRegion: ap-southeast-1
  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      alb.ingress.kubernetes.io/healthcheck-path: /api/health
      alb.ingress.kubernetes.io/success-codes: "200"
    hosts:
      - group2-capstone-grafana.sctp-sandbox.com

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'favourite'
          orgId: 1
          folder: 'Favourite'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/favourite

# 2. Prometheus configuration, persistent storage + Ingress
prometheus:
  enabled: true
  ingress:
    enabled: false
    # ingressClassName: alb
    # annotations:
    #   alb.ingress.kubernetes.io/scheme: internet-facing
    #   alb.ingress.kubernetes.io/target-type: ip
    #   alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    #   alb.ingress.kubernetes.io/ssl-redirect: "443"
    #   #alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-southeast-1:255945442255:certificate/aa61f32b-3ecf-4bff-b963-3c5b9d048bea"
    #   alb.ingress.kubernetes.io/backend-protocol: HTTP
    # hosts:
    #   - group2-capstone-prometheus.sctp-sandbox.com
  prometheusSpec:
    enableOTLPReceiver: true
    enableRemoteWriteReceiver: true
    additionalScrapeConfigs: []
    # For Prometheus v3+ / kube-prometheus-stack supporting otlp config:
    otlp:
      keepIdentifyingResourceAttributes: true
      promoteResourceAttributes:
        - service.instance.id
        - service.name
        - service.namespace
        - deployment.environment.name
        - service.version
        - k8s.cluster.name
        - k8s.namespace.name
        - k8s.pod.name
    nodeSelector:
      workload-tier: t3-medium-monitoring
    tolerations:
      - key: workload
        operator: Equal
        value: t3-medium-monitoring
        effect: NoSchedule
    webConfig:
      tlsConfig: null
    retention: 3d
    retentionSize: 5GB
    resources:
      requests:
        cpu: 250m
        memory: 768Mi
      limits:
        cpu: 1000m
        memory: 1152Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
prometheusOperator:
  nodeSelector:
    workload-tier: t3-medium-monitoring
  tolerations:
    - key: workload
      operator: Equal
      value: t3-medium-monitoring
      effect: NoSchedule
  admissionWebhooks:
    patch:
      nodeSelector:
        workload-tier: t3-medium-monitoring
      tolerations:
        - key: workload
          operator: Equal
          value: t3-medium-monitoring
          effect: NoSchedule

kube-state-metrics:
  nodeSelector:
    workload-tier: t3-medium-monitoring
  tolerations:
    - key: workload
      operator: Equal
      value: t3-medium-monitoring
      effect: NoSchedule

prometheus-node-exporter:
  hostNetwork: true
  hostPID: true
  tolerations:
    - operator: Exists