            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "100 * max(last_over_time(k6_http_req_failed_rate{namespace=~\"${namespace:regex}\",assessment_run=~\"${assessment_run:regex}\"}[$__range]))",
