apiVersion: v1
kind: ConfigMap
metadata:
  name: capstone-k6-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  capstone-k6.json: |
    {
      "id": null,
      "uid": "capstone-k6",
      "title": "Capstone — k6 Load Testing & Performance",
      "description": "Storefront load testing, HTTP performance, content reliability, network diagnostics and Kubernetes HPA correlation.",
      "tags": [
        "capstone",
        "sre",
        "k6",
        "performance",
        "load-testing",
        "gitops"
      ],
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "timezone": "Asia/Singapore",
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Environment",
            "type": "custom",
            "query": "retail-staging,retail-store",
            "multi": true,
            "includeAll": true,
            "allValue": "retail-staging|retail-store",
            "hide": 0,
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "options": [
              {
                "text": "retail-staging",
                "value": "retail-staging",
                "selected": false
              },
              {
                "text": "retail-store",
                "value": "retail-store",
                "selected": false
              }
            ]
          },
          {
            "name": "assessment_run",
            "label": "Assessment run",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(k6_vus{namespace=~\"${namespace:regex}\"}, assessment_run)",
            "query": {
              "query": "label_values(k6_vus{namespace=~\"${namespace:regex}\"}, assessment_run)",
              "refId": "VariableQuery"
            },
            "refresh": 2,
            "sort": 2,
            "multi": false,
            "includeAll": true,
            "options": [],
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "allValue": ".*"
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "title": "01 — Latest HTTP p95 latency",
          "description": "Latest available interval p95 in milliseconds. Maximum across matching series, not a pooled full-run percentile.",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "1000 * max(last_over_time(k6_http_req_duration_p95{namespace=~\"${namespace:regex}\",assessment_run=~\"${assessment_run:regex}\"}[$__range]))",
              "legendFormat": "HTTP p95",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "min": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 500
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 2,
          "title": "02 — Latest HTTP failure rate",
          "description": "Worst latest reported series failure rate.",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
