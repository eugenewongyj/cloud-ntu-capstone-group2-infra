apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-opentelemetry-apm
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  opentelemetry-apm.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "APM metrics for Retail Store services via OpenTelemetry spanmetrics.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "green",
                "mode": "fixed"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(traces_span_metrics_duration_milliseconds_count{job=\"retail-store-collector-collector\", span_kind=\"SPAN_KIND_SERVER\", service_name=\"$app\", span_name=~\"$route\"}) by(service_name)",
              "instant": true,
              "legendFormat": "{{service_name}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Total Request",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": 0 }]
              },
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Errors" },
                "properties": [
                  {
                    "id": "color",
                    "value": { "fixedColor": "red", "mode": "fixed" }
                  }
                ]
              }
            ]
          },
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 0 },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(traces_span_metrics_duration_milliseconds_count{job=\"retail-store-collector-collector\", service_name=\"$app\", span_kind=\"SPAN_KIND_SERVER\", status_code!=\"STATUS_CODE_ERROR\", span_name=~\"$route\"})",
              "format": "time_series",
              "instant": true,
              "legendFormat": "Success (OK)",
              "range": true,
              "refId": "OK"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(traces_span_metrics_duration_milliseconds_count{job=\"retail-store-collector-collector\", service_name=\"$app\", span_kind=\"SPAN_KIND_SERVER\", status_code=\"STATUS_CODE_ERROR\", span_name=~\"$route\"}) or vector(0)",
              "format": "time_series",
              "instant": true,
              "legendFormat": "Errors",
              "range": true,
              "refId": "ERR"
            }
          ],
          "title": "Requests Count",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "request amount distribution",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 0 },
          "id": 4,
          "options": {
            "displayLabels": ["percent"],
            "legend": {
              "displayMode": "list",
              "placement": "right",
              "showLegend": true,
              "values": ["percent"]
            },
            "pieType": "donut",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "sort": "desc"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(traces_span_metrics_duration_milliseconds_count{job=\"retail-store-collector-collector\", span_kind=\"SPAN_KIND_SERVER\", service_name=\"$app\", span_name=~\"$route\"}) by(span_name)",
              "legendFormat": "{{span_name}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Request Distribution",
          "type": "piechart"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "cumulative latency distribution",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 0 },
          "id": 7,
          "options": {
            "displayLabels": ["percent"],
            "legend": {
              "displayMode": "list",
              "placement": "right",
              "showLegend": true,
              "values": ["percent"]
            },
            "pieType": "donut",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "sort": "desc"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(traces_span_metrics_duration_milliseconds_sum{job=\"retail-store-collector-collector\", span_kind=\"SPAN_KIND_SERVER\", service_name=\"$app\", span_name=~\"$route\"}) by(span_name)",
              "instant": true,
              "legendFormat": "{{span_name}}",
              "refId": "A"
            }
          ],
          "title": "Loading Distribution",
          "type": "piechart"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "overall request rate per minute over last 3 minutes",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "percentage",
                "steps": [{ "color": "green", "value": 0 }]
              },
              "unit": "reqpm"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 3, "x": 0, "y": 4 },
          "id": 8,
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(traces_span_metrics_duration_milliseconds_count{job=\"retail-store-collector-collector\", span_kind=\"SPAN_KIND_SERVER\", service_name=\"$app\", span_name=~\"$route\"}[3m])*60)",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Overall Request Rate",
          "type": "gauge"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "percentage of failed spans in all requests",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "percentage",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 10 }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 3, "x": 3, "y": 4 },
          "id": 9,
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "(sum(traces_span_metrics_duration_milliseconds_count{job=\"retail-store-collector-collector\", span_kind=\"SPAN_KIND_SERVER\", service_name=\"$app\", status_code=\"STATUS_CODE_ERROR\", span_name=~\"$route\"}) or vector(0)) / sum(traces_span_metrics_duration_milliseconds_count{job=\"retail-store-collector-collector\", span_kind=\"SPAN_KIND_SERVER\", service_name=\"$app\", span_name=~\"$route\"})",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Overall Error Rate",
          "type": "gauge"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "request rate per minute over last 3 minutes",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "lineWidth": 1, "showPoints": "auto" },
              "unit": "reqpm"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 8 },
          "id": 1,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(traces_span_metrics_duration_milliseconds_count{job=\"retail-store-collector-collector\", service_name=\"$app\", span_kind=\"SPAN_KIND_SERVER\", span_name=~\"$route\"}[3m])*60) by(span_name)",
              "legendFormat": "{{span_name}}",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Request Rate",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "PR95 latency over last 3 minutes",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "lineWidth": 1, "showPoints": "auto" },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 8 },
          "id": 5,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum(rate(traces_span_metrics_duration_milliseconds_bucket{job=\"retail-store-collector-collector\", span_kind=\"SPAN_KIND_SERVER\", service_name=\"$app\", span_name=~\"$route\"}[3m])) by (le, span_name))",
              "legendFormat": "{{span_name}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "PR95 Latency",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "by route",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "continuous-GrYlRd" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 80 }
                ]
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 8 },
          "id": 6,
          "options": {
            "displayMode": "lcd",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "showUnfilled": true,
            "valueMode": "color"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sort_desc(sum(traces_span_metrics_duration_milliseconds_sum{job=\"retail-store-collector-collector\", span_kind=\"SPAN_KIND_SERVER\", service_name=\"$app\", span_name=~\"$route\"}) by (span_name) / sum(traces_span_metrics_duration_milliseconds_count{job=\"retail-store-collector-collector\", span_kind=\"SPAN_KIND_SERVER\", service_name=\"$app\", span_name=~\"$route\"}) by (span_name))",
              "instant": true,
              "legendFormat": "{{span_name}}",
              "refId": "A"
            }
          ],
          "title": "Average Latency",
          "type": "bargauge"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Details of each API",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 80 }
                ]
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Request Rate" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "type": "sparkline" } },
                  { "id": "unit", "value": "reqpm" }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Error Rate" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "type": "sparkline" } },
                  { "id": "unit", "value": "percentunit" }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "PR95 Latency" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "type": "sparkline" } },
                  { "id": "unit", "value": "ms" }
                ]
              }
            ]
          },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 16 },
          "id": 10,
          "options": {
            "cellHeight": "sm",
            "enablePagination": true,
            "showHeader": true
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(traces_span_metrics_duration_milliseconds_count{job=\"retail-store-collector-collector\", service_name=\"$app\", span_name=~\"$route\", span_kind=\"SPAN_KIND_SERVER\"}[3m])*60) by(service_name, span_name)",
              "format": "time_series",
              "range": true,
              "refId": "Request Rate"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum(rate(traces_span_metrics_duration_milliseconds_bucket{job=\"retail-store-collector-collector\", service_name=\"$app\", span_name=~\"$route\", span_kind=\"SPAN_KIND_SERVER\"}[3m])) by (le, service_name, span_name))",
              "range": true,
              "refId": "PR95"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "(sum(traces_span_metrics_duration_milliseconds_count{job=\"retail-store-collector-collector\", service_name=\"$app\", span_name=~\"$route\", span_kind=\"SPAN_KIND_SERVER\", status_code=\"STATUS_CODE_ERROR\"}) by(service_name, span_name) or sum(traces_span_metrics_duration_milliseconds_count{job=\"retail-store-collector-collector\", service_name=\"$app\", span_name=~\"$route\", span_kind=\"SPAN_KIND_SERVER\"}) by(service_name, span_name) * 0) / sum(traces_span_metrics_duration_milliseconds_count{job=\"retail-store-collector-collector\", service_name=\"$app\", span_name=~\"$route\", span_kind=\"SPAN_KIND_SERVER\"}) by(service_name, span_name)",
              "format": "time_series",
              "range": true,
              "refId": "Error Rate"
            }
          ],
          "title": "Details",
          "transformations": [
            { "id": "timeSeriesTable", "options": {} },
            { "id": "merge", "options": {} },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true },
                "indexByName": {
                  "Time": 0,
                  "service_name": 1,
                  "span_name": 2,
                  "Trend #Request Rate": 3,
                  "Trend #PR95": 4,
                  "Trend #Error Rate": 5,
                  "Value #Request Rate": 6,
                  "Value #PR95": 7,
                  "Value #Error Rate": 8
                },
                "renameByName": {
                  "Trend #Error Rate": "Error Rate Trend",
                  "Trend #PR95": "PR95 Latency Trend",
                  "Trend #Request Rate": "Request Rate Trend",
                  "Value #Error Rate": "Error Rate",
                  "Value #PR95": "PR95 Latency",
                  "Value #Request Rate": "Request Rate",
                  "service_name": "Application",
                  "span_name": "Route"
                }
              }
            }
          ],
          "type": "table"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [],
      "templating": {
        "list": [
          {
            "allowCustomValue": true,
            "current": {},
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "label_values(traces_span_metrics_duration_milliseconds_count{job=\"retail-store-collector-collector\"}, service_name)",
            "hide": 0,
            "includeAll": false,
            "label": "Application",
            "multi": false,
            "name": "app",
            "query": {
              "qryType": 1,
              "query": "label_values(traces_span_metrics_duration_milliseconds_count{job=\"retail-store-collector-collector\"}, service_name)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "refresh": 1,
            "sort": 1,
            "type": "query"
          },
          {
            "allowCustomValue": true,
            "current": {},
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "label_values(traces_span_metrics_duration_milliseconds_count{job=\"retail-store-collector-collector\", span_kind=\"SPAN_KIND_SERVER\", service_name=\"$app\"}, span_name)",
            "hide": 0,
            "includeAll": true,
            "label": "Route",
            "multi": true,
            "name": "route",
            "query": {
              "qryType": 1,
              "query": "label_values(traces_span_metrics_duration_milliseconds_count{job=\"retail-store-collector-collector\", span_kind=\"SPAN_KIND_SERVER\", service_name=\"$app\"}, span_name)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "refresh": 1,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-15m", "to": "now" },
      "timezone": "browser",
      "title": "OpenTelemetry APM (Retail Store)",
      "uid": "opentelemetry-apm-custom",
      "version": 1
    }