              "options": {
                "mode": "markdown",
                "content": "### Catalogue workload; not an automated purchase.\n\n[Production storefront](https://group2-shop.sctp-sandbox.com/catalog) | [Infrastructure repository](https://github.com/eugenewongyj/cloud-ntu-capstone-group2-infra) | [Application repository](https://github.com/eugenewongyj/cloud-ntu-capstone-group2-app)\n\n**Copy into WSL:**\n\n```bash\ncd ~/capstone-presentation/cloud-ntu-capstone-group2-infra\n\nif [[ -f gitops/sre/validate/capstone-demo.sh ]]; then\n  bash gitops/sre/validate/capstone-demo.sh baseline\nelse\n  echo \"Shared assessment runner not yet integrated\"\nfi\n```\n\n**Expected evidence:** Select retail-store and the assessment run in Grafana. Measure p95, throughput and failures."
              }
