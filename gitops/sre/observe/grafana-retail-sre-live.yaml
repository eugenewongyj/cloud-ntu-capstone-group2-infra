            "content": "**Recovery:** Controller evaluates sustained customer health after demand returns to baseline. Target: within five minutes; observation: five to ten minutes.\n\n**Cost:** Compare verified baseline and peak node-hours, AWS unit rates, fixed services and storage. No estimated cost is presented as actual billing."
