                "content": "### Observe recovery after the synthetic workload stops.\n\n[Production storefront](https://group2-shop.sctp-sandbox.com/catalog) | [Infrastructure repository](https://github.com/eugenewongyj/cloud-ntu-capstone-group2-infra) | [Application repository](https://github.com/eugenewongyj/cloud-ntu-capstone-group2-app)\n\n**Copy into WSL:**\n\n```bash\nkubectl get hpa,deployments,pods \\\n  -n retail-store\n\nkubectl get events \\\n  -n retail-store \\\n  --sort-by=.lastTimestamp\n```\n\n**Expected evidence:** Observe recovery for at least five minutes. Preserve the assessment run ID and absolute dashboard time range."
              }
