        {
          "id": 231,
          "title": "Assessment acceptance criteria",
          "type": "text",
          "gridPos": {
            "x": 0,
            "y": 195,
            "w": 24,
            "h": 16
          },
          "options": {
            "mode": "markdown",
            "content": "\n### Operational assessment objectives\n\n| Objective | Acceptance criterion |\n|---|---|\n| Normal Sale | Five-minute baseline |\n| Flash Sale | Five-minute staged 10x / 20x workload |\n| Product listing latency | p95 below 500 ms |\n| HTTP failures | Below 1% |\n| Content failures | Below 1% |\n| Recovery | Target within 5 minutes; maximum 10 |\n| Capacity | Observe actual HPA and ready replicas |\n| Alerting | Verify genuine threshold breach and delivery |\n| Logging | Correlate application logs with run timestamps |\n\n### Cost accountability\n\n- Observe node count and instance types.\n- Compare resource utilisation before, during and after load.\n- Monitor whether additional capacity is released.\n- Include EKS, EC2, ALB, CloudFront, RDS, storage and telemetry.\n- Actual billing requires verified AWS billing data.\n- Missing cost data must not be interpreted as zero cost.\n\nCloudWatch metrics are shared infrastructure observations,\nnot measurements attributable exclusively to one k6 run.\n"
          }
        }
