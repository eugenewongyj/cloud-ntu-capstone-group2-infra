                "w": 24,
                "h": 17
              },
              "options": {
                "mode": "markdown",
                "content": "### Open the production storefront and complete a demonstration purchase.\n\n[Production storefront](https://group2-shop.sctp-sandbox.com/catalog) | [Infrastructure repository](https://github.com/eugenewongyj/cloud-ntu-capstone-group2-infra) | [Application repository](https://github.com/eugenewongyj/cloud-ntu-capstone-group2-app)\n\n**Copy into WSL:**\n\n```bash\nfor HOST in group2-shop group2-retail; do\n  echo \"===== $HOST =====\"\n\n  curl -sS --max-time 20 \\\n    -o /dev/null \\\n    -w 'HTTP: %{http_code}\\n' \\\n    \"https://${HOST}.sctp-sandbox.com/catalog\"\ndone\n```\n\n**Expected evidence:** Public storefront HTTP 200. Protected origin HTTP 403 by design. Show the manual order confirmation."
              }
            }
