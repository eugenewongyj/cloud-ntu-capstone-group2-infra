        {
          "type": "text",
          "title": "08 | CAPSTONE ASSESSMENT EVIDENCE",
          "gridPos": {
            "x": 0,
            "y": 135,
            "w": 24,
            "h": 12
          },
          "options": {
            "mode": "markdown",
            "content": "| Requirement | Evidence source |\n|---|---|\n| p95 <= 500 ms | Run-specific k6 measurements |\n| Request rate and errors | Prometheus |\n| CPU and memory | Container metrics |\n| Automatic elasticity | HPA and ready replicas |\n| Centralised logs | Loki |\n| Log retention | Deployed Loki configuration |\n| Two SLIs/SLOs | Documented objectives |\n| Two alerts | Deployed Prometheus rules |\n| Notification delivery | Discord evidence |\n| Incident runbook | GitHub documentation |\n| Baseline versus peak cost | Verified cost model |\n\n**No automatic pass is assigned without evidence.**"
          },
          "id": 21
