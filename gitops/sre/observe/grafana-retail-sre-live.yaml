        {
          "id": 77,
          "type": "text",
          "title": "Normal Sale — 1x Traffic",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 10
          },
          "options": {
            "mode": "markdown",
            "content": "### Normal Sale\n\n**Duration:** 5 minutes\n\n**Baseline:** 1 virtual user\n\n**Recovery:** 5–10 minutes\n\nObserve normal storefront performance,\nrequest throughput, latency and resource\nutilization.\n\n[Open GitHub Actions](https://github.com/eugenewongyj/cloud-ntu-capstone-group2-infra/actions)\n\n[Open Production Storefront](https://group2-shop.sctp-sandbox.com/catalog)\n\nExecution requires a separate authorized\nload-test runner.\n"
          }
        },
        {
          "id": 78,
          "type": "text",
          "title": "11.11 Flash Sale — 10x / 20x Traffic",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 10
          },
          "options": {
            "mode": "markdown",
            "content": "### 11.11 Flash Sale\n\n**Duration:** 5 minutes\n\n**Peak:** 20 virtual users at baseline 1\n\n**Recovery:** 5–10 minutes\n\nObserve latency, HTTP failures,\nCPU utilization, HPA replicas\nand application recovery.\n\n[Open GitHub Actions](https://github.com/eugenewongyj/cloud-ntu-capstone-group2-infra/actions)\n\n[Open k6 Performance Dashboard](/d/capstone-k6)\n\nExecution requires a separate authorized\nload-test runner.\n"
          }
        },
        {
          "id": 79,
          "type": "text",
          "title": "Technical Commentary — Live Assessment",
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 16,
            "h": 10
          },
          "options": {
            "mode": "markdown",
            "content": "### What are we monitoring?\n\n- **Latency:** Product listing p95 target below 500 ms.\n- **Errors:** HTTP and content failure targets below 1%.\n- **Traffic:** Requests per second and virtual users.\n- **Scaling:** CPU utilization and HPA replica changes.\n- **Recovery:** Target within 5 minutes; maximum 10 minutes.\n\n### What does this mean?\n\nThe dashboard shows whether the online\nstore remains responsive during increased\ncustomer demand and whether application\nhealth returns to normal afterwards.\n\nNo data means no matching telemetry.\nIt does not mean zero failures or\nsuccessful recovery.\n"
          }
        },
        {
          "id": 80,
          "type": "text",
          "title": "Shared SRE Navigation",
          "gridPos": {
            "x": 16,
            "y": 10,
            "w": 8,
            "h": 10
          },
          "options": {
            "mode": "markdown",
            "content": "### Capstone Dashboards\n\n[Original 11.11 Mission Control](/d/capstone-retail-sre-1111)\n\n[Storefront Customer Journey](/d/capstone-storefront-journey)\n\n[k6 Performance](/d/capstone-k6)\n\n[HPA and Autoscaling](/d/capstone-hpa)\n\n[Argo CD](https://group2-capstone-argocd.sctp-sandbox.com)\n\n**Refresh:** 10 seconds\n\n**Environment:** Production\n\n**Execution:** External authorized runner\n"
          }
        },
        {
          "id": 1,
          "type": "text",
          "title": "Capstone — Retail SRE Mission Control",
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 24,
            "h": 6
          },
          "options": {
            "mode": "markdown",
            "content": "## NORMAL DAY → 11.11 FLASH SALE → RECOVERY\n**Production shopper URL:** `https://group2-shop.sctp-sandbox.com` → **CloudFront WAF** → protected **ALB WAF** → **EKS retail-store**. The ALB-origin URL returns HTTP 403 when accessed directly **by design**.\n\n**How to demo:** select `retail-store`, set time range covering **both** tests, choose `All` assessment runs and profiles. For a precise comparison, select one run at a time and preserve its time window. **The dashboard never fabricates purchases or capacity changes.** Missing metrics show **No data**, not zero.\n\n🟢 Green = within threshold · 🟠 Orange = degraded/approaching limit · 🔴 Red = threshold breached · **No data = telemetry not yet available**.\n\n**PRESENTATION RUNBOOK:** Expand sections 00A–00H below in sequence. Copy each command into WSL. All presenters must compare repository revisions before starting. Only one operator runs load tests.\n\n[Flash Sale p95 Latency & SLO Health](/d/p95-slo-health)"
          }
        },
        {
          "id": 62,
          "type": "row",
          "title": "00A — Synchronise GitHub repositories",
          "collapsed": true,
          "gridPos": {
            "x": 0,
            "y": 26,
            "w": 24,
            "h": 1
          },
          "panels": [
            {
              "id": 63,
              "type": "text",
              "title": "Instructions and expected evidence",
              "transparent": false,
              "gridPos": {
                "x": 0,
                "y": 39,
                "w": 24,
                "h": 39
              },
              "options": {
                "mode": "markdown",
                "content": "### Start every presentation from a clean, shared source baseline.\n\n[Production storefront](https://group2-shop.sctp-sandbox.com/catalog) | [Infrastructure repository](https://github.com/eugenewongyj/cloud-ntu-capstone-group2-infra) | [Application repository](https://github.com/eugenewongyj/cloud-ntu-capstone-group2-app)\n\n**Copy into WSL:**\n\n```bash\n(\nset -euo pipefail\n\nmkdir -p ~/capstone-presentation\ncd ~/capstone-presentation\n\nfor REPO in \\\n  cloud-ntu-capstone-group2-infra \\\n  cloud-ntu-capstone-group2-app\ndo\n  if [[ ! -d \"$REPO/.git\" ]]; then\n    git clone \\\n      \"https://github.com/eugenewongyj/$REPO.git\"\n  fi\n\n  (\n    cd \"$REPO\"\n    test -z \"$(git status --porcelain)\"\n    git switch main\n    git pull --ff-only origin main\n\n    echo \"===== $REPO =====\"\n    git log -1 --oneline\n    git rev-parse HEAD\n\n    test \"$(git rev-parse HEAD)\" = \\\n      \"$(git rev-parse origin/main)\"\n  )\ndone\n)\n```\n\n**Expected evidence:** Both repositories synchronised. Compare full commit SHAs across all group members. Agree on fixed revisions if main changes."
              }
            }
          ]
        },
        {
          "id": 64,
          "type": "row",
          "title": "00B — Initialise AWS and EKS",
          "collapsed": true,
          "gridPos": {
            "x": 0,
            "y": 27,
            "w": 24,
            "h": 1
          },
          "panels": [
            {
              "id": 65,
              "type": "text",
              "title": "Instructions and expected evidence",
              "transparent": false,
              "gridPos": {
                "x": 0,
                "y": 40,
                "w": 24,
                "h": 17
              },
              "options": {
                "mode": "markdown",
                "content": "### Use your own authorised AWS credentials.\n\n[Production storefront](https://group2-shop.sctp-sandbox.com/catalog) | [Infrastructure repository](https://github.com/eugenewongyj/cloud-ntu-capstone-group2-infra) | [Application repository](https://github.com/eugenewongyj/cloud-ntu-capstone-group2-app)\n\n**Copy into WSL:**\n\n```bash\naws sts get-caller-identity\n\naws eks update-kubeconfig \\\n  --name group2-capstone-cluster \\\n  --region ap-southeast-1\n\nkubectl config current-context\nkubectl get nodes\n```\n\n**Expected evidence:** Correct AWS account and EKS cluster. All expected nodes Ready."
              }
            }
          ]
        },
        {
          "id": 66,
          "type": "row",
          "title": "00C — Verify GitOps deployment",
          "collapsed": true,
          "gridPos": {
            "x": 0,
            "y": 28,
            "w": 24,
            "h": 1
          },
          "panels": [
            {
              "id": 67,
              "type": "text",
              "title": "Instructions and expected evidence",
              "transparent": false,
              "gridPos": {
                "x": 0,
                "y": 41,
                "w": 24,
                "h": 18
              },
              "options": {
                "mode": "markdown",
                "content": "### Confirm that GitHub changes have reached the cluster.\n\n[Production storefront](https://group2-shop.sctp-sandbox.com/catalog) | [Infrastructure repository](https://github.com/eugenewongyj/cloud-ntu-capstone-group2-infra) | [Application repository](https://github.com/eugenewongyj/cloud-ntu-capstone-group2-app)\n\n**Copy into WSL:**\n\n```bash\nkubectl get applications -n argocd\n\nkubectl get application capstone-monitoring \\\n  -n argocd -o json |\njq '{\n  revision: .status.sync.revision,\n  sync: .status.sync.status,\n  health: .status.health.status\n}'\n```\n\n**Expected evidence:** Synced and Healthy. Compare the deployed monitoring revision with the agreed infrastructure SHA."
              }
