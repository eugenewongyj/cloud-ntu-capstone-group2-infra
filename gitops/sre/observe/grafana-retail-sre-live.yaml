              "transparent": false,
              "gridPos": {
                "x": 0,
                "y": 45,
                "w": 24,
                "h": 17
              },
              "options": {
                "mode": "markdown",
                "content": "### Only one designated operator executes load testing. Verify the runner and agreed load limits first.\n\n[Production storefront](https://group2-shop.sctp-sandbox.com/catalog) | [Infrastructure repository](https://github.com/eugenewongyj/cloud-ntu-capstone-group2-infra) | [Application repository](https://github.com/eugenewongyj/cloud-ntu-capstone-group2-app)\n\n**Copy into WSL:**\n\n```bash\ncd ~/capstone-presentation/cloud-ntu-capstone-group2-infra\n\nif [[ -f gitops/sre/validate/capstone-demo.sh ]]; then\n  CAPSTONE_LOAD_APPROVED=YES \\\n    bash gitops/sre/validate/capstone-demo.sh flash-demo\nelse\n  echo \"Shared assessment runner not yet integrated\"\nfi\n```\n\n**Expected evidence:** Observe demand, latency, errors, HPA and CloudWatch. Stop on sustained degradation. Scaling is not guaranteed."
              }
            }
