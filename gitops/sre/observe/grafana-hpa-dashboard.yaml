        },
        {
          "id": 9,
          "title": "Workload — CPU Utilization vs Requests",
          "description": "Independent container CPU utilization relative to configured CPU requests. Not identical to the HPA calculation.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 32,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "\n100 *\nsum by (namespace, container) (\n  max by (namespace, pod, container) (\n    rate(container_cpu_usage_seconds_total{\n      namespace=~\"${namespace:regex}\",\n      container=~\"ui|catalog|carts|orders|checkout\",\n      job=\"kubelet\",\n      metrics_path=\"/metrics/cadvisor\"\n    }[2m])\n  )\n)\n/\nsum by (namespace, container) (\n  max by (namespace, pod, container) (\n    kube_pod_container_resource_requests{\n      namespace=~\"${namespace:regex}\",\n      container=~\"ui|catalog|carts|orders|checkout\",\n      resource=\"cpu\",\n      unit=\"core\"\n    }\n  )\n)\n",
              "legendFormat": "{{namespace}} / {{container}}",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 70
                  }
                ]
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false,
                "thresholdsStyle": {
                  "mode": "line"
                }
              }
            },
            "overrides": []
