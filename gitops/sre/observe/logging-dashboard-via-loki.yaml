            "type": "query"
          },
          {
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "loki",
              "uid": "${DS_LOKI}"
            },
            "definition": "label_values({namespace=~\"$namespace\"}, container)",
            "hide": 0,
            "includeAll": true,
            "label": "Container",
            "multi": true,
            "name": "container",
            "options": [],
            "query": {
              "label": "container",
              "refId": "LokiVariableQueryEditor-VariableQuery",
              "stream": "{namespace=~\"$namespace\"}",
              "type": 1
            },
            "refresh": 1,
            "regex": "",
            "sort": 1,
            "type": "query"
          },
          {
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "loki",
              "uid": "${DS_LOKI}"
            },
            "definition": "label_values({namespace=~\"$namespace\", container=~\"$container\"}, pod)",
            "hide": 0,
            "includeAll": true,
            "label": "Pod",
            "multi": true,
            "name": "pod",
            "options": [],
            "query": {
              "label": "pod",
              "refId": "LokiVariableQueryEditor-VariableQuery",
              "stream": "{namespace=~\"$namespace\", container=~\"$container\"}",
              "type": 1
            },
            "refresh": 2,
            "regex": "",
            "sort": 1,
            "type": "query"
          },
          {
            "current": {
              "selected": false,
              "text": "error",
              "value": "error"
            },
            "hide": 0,
            "label": "Search (case insensitive)",
            "name": "searchable_pattern",
            "options": [
              {
                "selected": false,
                "text": "",
                "value": ""
              }
            ],
            "query": "error",
            "type": "textbox"
          }
        ]
      },
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Logging Dashboard via Loki",
      "uid": "logging-via-loki-custom",
      "version": 1
    }