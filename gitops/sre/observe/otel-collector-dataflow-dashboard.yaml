apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-data-flow-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  otel-collector-data-flow.json: |-
    {
      "title": "Opentelemetry Collector Data Flow (Fixed)",
      "uid": "otel-collector-data-flow-fixed",
      "timezone": "browser",
      "refresh": "30s",
      "schemaVersion": 39,
      "panels": [
        {
          "id": 6,
          "title": "Instance",
          "type": "stat",
          "gridPos": { "h": 4, "w": 3, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "count(count by (service_instance_id) (target_info))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 12,
          "title": "Accepted Spans (OTel)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 4 },
          "targets": [
            {
              "expr": "sum(rate(traces_span_metrics_calls_total[$__rate_interval])) by (service_name)",
              "legendFormat": "{{service_name}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 17,
          "title": "Refused Spans",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 4 },
          "targets": [
            {
              "expr": "sum(rate(otelcol_receiver_refused_spans[$__rate_interval])) by (receiver)",
              "legendFormat": "{{receiver}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Trace Pipeline Flow",
          "type": "nodeGraph",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "label_replace(label_replace(sum by (service_name) (rate(traces_span_metrics_calls_total[$__interval])), \"id\", \"processor\", \"dummynode\", \"\"), \"title\", \"processor\", \"dummynode\", \"\")",
              "format": "table",
              "instant": true,
              "refId": "nodes"
            },
            {
              "expr": "label_replace(label_replace(rate(traces_span_metrics_calls_total[$__interval]), \"source\", \"processor\", \"\", \"\"), \"target\", \"exporter\", \"\", \"\")",
              "format": "table",
              "instant": true,
              "refId": "edges"
            }
          ]
        },
        {
          "id": 24,
          "title": "CPU Usage",
          "type": "gauge",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 18 },
          "targets": [
            {
              "expr": "avg(rate(otelcol_process_cpu_seconds[$__rate_interval]) * 100) by (instance)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "percent", "max": 100 }
          }
        },
        {
          "id": 38,
          "title": "Memory (RSS)",
          "type": "gauge",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 18 },
          "targets": [
            {
              "expr": "avg(otelcol_process_memory_rss) by (instance)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "bytes" }
          }
        }
      ],
      "templating": {
        "list": [
          {
            "name": "service_version",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "query": "query_result(count by (service_version) (target_info))",
            "regex": "/.*service_version=\"(.*)\".*/",
            "refresh": 2
          }
        ]
      }
    }