apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cluster-overview-nomad
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cluster-overview.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "datasource",
              "uid": "grafana"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "target": {
              "limit": 100,
              "matchAny": false,
              "tags": [],
              "type": "dashboard"
            },
            "type": "dashboard"
          }
        ]
      },
      "description": "Nomad cluster dashboard. Using built in nomad's exporter and loki.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "gnetId": 17549,
      "graphTooltip": 1,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 207,
          "panels": [],
          "title": "Cluster Summary",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "fixedColor": "green", "mode": "fixed" },
              "decimals": 0,
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "text", "value": null }]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 2, "x": 0, "y": 1 },
          "id": 221,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "nomad_nomad_job_status_running{}",
              "instant": true,
              "legendFormat": "Running",
              "refId": "A"
            }
          ],
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "In the whole cluster",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": { "h": 6, "w": 6, "x": 2, "y": 1 },
          "id": 107,
          "options": {
            "displayLabels": ["percent"],
            "legend": { "displayMode": "list", "placement": "right", "showLegend": true },
            "pieType": "donut",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(nomad_client_allocs_cpu_allocated) by (exported_job)",
              "legendFormat": "{{exported_job}}",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(nomad_client_unallocated_cpu)",
              "legendFormat": "Free cluster CPU",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Allocated CPU ($datacenter)",
          "type": "piechart"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 80 }
                ]
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "from" },
                "properties": [{ "id": "custom.hidden", "value": true }]
              },
              {
                "matcher": { "id": "byName", "options": "to" },
                "properties": [{ "id": "custom.hidden", "value": true }]
              }
            ]
          },
          "gridPos": { "h": 4, "w": 13, "x": 8, "y": 1 },
          "id": 215,
          "options": { "frameIndex": 0, "showHeader": true },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "nomad_client_allocs_oom_killed{}",
              "format": "table",
              "legendFormat": "oom",
              "refId": "A"
            }
          ],
          "title": "OOM kills",
          "type": "table"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                {
                  "options": {
                    "0": { "color": "red", "index": 1, "text": "Unhealthy" },
                    "1": { "color": "green", "index": 0, "text": "Healthy" }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "text", "value": null }]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 12, "w": 3, "x": 21, "y": 1 },
          "id": 229,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "up{job=\"nomad_metrics\"}",
              "format": "time_series",
              "instant": true,
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "title": "Node status",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "fixedColor": "light-orange", "mode": "fixed" },
              "decimals": 0,
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "text", "value": null }]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 2, "x": 0, "y": 5 },
          "id": 217,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "nomad_nomad_job_status_pending",
              "instant": true,
              "legendFormat": "Pending",
              "refId": "A"
            }
          ],
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "In whole cluster",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": { "h": 6, "w": 6, "x": 2, "y": 7 },
          "id": 86,
          "options": {
            "displayLabels": ["percent"],
            "legend": { "displayMode": "list", "placement": "right", "showLegend": true },
            "pieType": "donut",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(nomad_client_allocs_memory_allocated) by (exported_job)",
              "legendFormat": "{{exported_job}}",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(nomad_client_host_memory_free)",
              "legendFormat": "Free cluster MEM",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Allocated MEM ($datacenter)",
          "type": "piechart"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "fixedColor": "super-light-red", "mode": "fixed" },
              "decimals": 0,
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "text", "value": null }]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 2, "x": 0, "y": 9 },
          "id": 219,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "nomad_nomad_job_status_dead",
              "instant": true,
              "legendFormat": "Dead",
              "refId": "A"
            }
          ],
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 13 },
          "id": 239,
          "panels": [],
          "title": "Logs",
          "type": "row"
        },
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 13, "w": 24, "x": 0, "y": 14 },
          "id": 127,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "editorMode": "code",
              "expr": "{instance=~\"$host\"}",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Logs ($datacenter)",
          "type": "logs"
        }
      ],
      "refresh": "1m",
      "schemaVersion": 37,
      "style": "dark",
      "tags": ["nomad", "host", "cluster"],
      "templating": {
        "list": [
          {
            "current": {},
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "hide": 0,
            "includeAll": false,
            "label": "DC",
            "multi": false,
            "name": "datacenter",
            "query": {
              "query": "label_values(nomad_client_uptime, datacenter)",
              "refId": "de1-datacenter-Variable-Query"
            },
            "refresh": 1,
            "type": "query"
          },
          {
            "current": {},
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "hide": 0,
            "includeAll": true,
            "label": "Host",
            "multi": true,
            "name": "host",
            "query": {
              "query": "label_values(nomad_client_uptime{datacenter=~\"$datacenter\"}, host)",
              "refId": "de1-host-Variable-Query"
            },
            "refresh": 1,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-15m", "to": "now" },
      "timezone": "",
      "title": "Cluster overview (Nomad)",
      "uid": "masiNomadCluster",
      "version": 1
    }