apiVersion: v1
kind: ConfigMap
metadata:
  name: capstone-storefront-journey-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
    app.kubernetes.io/part-of: capstone-sre
data:
  capstone-storefront-journey.json: |
    {
      "id": null,
      "uid": "capstone-storefront-journey",
      "title": "Capstone — Storefront Customer Journey",
      "schemaVersion": 39,
      "version": 1,
      "timezone": "Asia/Singapore",
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "tags": [
        "capstone",
        "sre",
        "storefront"
      ],
      "editable": true,
      "templating": {
        "list": [
          {
            "name": "assessment_run",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(k6_vus{project=\"Capstone\",namespace=\"retail-store\"}, assessment_run)",
              "refId": "run"
            },
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "name": "cloudwatch_datasource",
            "type": "datasource",
            "query": "cloudwatch",
            "refresh": 1,
            "current": {
              "text": "CloudWatch",
              "value": "CloudWatch"
            }
          },
          {
            "name": "distribution_id",
            "label": "Production CloudFront distribution",
            "type": "textbox",
            "query": "EG61F5PSVL6LX",
            "current": {
              "text": "EG61F5PSVL6LX",
              "value": "EG61F5PSVL6LX"
            }
          },
          {
            "name": "catalog_db",
            "label": "Catalog DB instance",
            "type": "textbox",
            "query": "VERIFY_PRODUCTION_DB",
            "current": {
              "text": "VERIFY_PRODUCTION_DB",
              "value": "VERIFY_PRODUCTION_DB"
            }
          },
          {
            "name": "basket_table",
            "label": "Basket DynamoDB table",
            "type": "textbox",
            "query": "VERIFY_PRODUCTION_TABLE",
            "current": {
              "text": "VERIFY_PRODUCTION_TABLE",
              "value": "VERIFY_PRODUCTION_TABLE"
            }
          },
          {
            "name": "orders_db",
            "label": "Orders DB instance",
            "type": "textbox",
            "query": "VERIFY_PRODUCTION_DB",
            "current": {
              "text": "VERIFY_PRODUCTION_DB",
              "value": "VERIFY_PRODUCTION_DB"
            }
          }
        ]
      },
      "links": [
        {
          "title": "Storefront",
          "type": "link",
          "url": "https://group2-shop.sctp-sandbox.com",
          "targetBlank": true
        },
        {
          "title": "Original 11.11",
          "type": "link",
          "url": "/d/capstone-retail-sre-1111",
          "targetBlank": true
        },
        {
          "title": "Live Mission Control",
          "type": "link",
          "url": "/d/capstone-retail-sre-live",
          "targetBlank": true
        }
      ],
      "panels": [
        {
          "id": 1,
          "title": "Storefront customer journey",
          "type": "text",
          "description": "**Visit → Browse → Basket → Checkout → Order**\n\n[Open production storefront](https://group2-shop.sctp-sandbox.com) · [Browse products](https://group2-shop.sctp-sandbox.com/catalog)\n\nCloudWatch is aggregate telemetry, not individual clicks. k6 is synthetic catalog traffic only. Missing metrics are not zero. Database selectors must be verified against production resources.",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 5
          },
          "options": {
            "mode": "markdown",
            "content": "**Visit → Browse → Basket → Checkout → Order**\n\n[Open production storefront](https://group2-shop.sctp-sandbox.com) · [Browse products](https://group2-shop.sctp-sandbox.com/catalog)\n\nCloudWatch is aggregate telemetry, not individual clicks. k6 is synthetic catalog traffic only. Missing metrics are not zero. Database selectors must be verified against production resources."
          }
        },
        {
          "id": 2,
          "title": "01 — Enter storefront",
          "type": "text",
          "description": "**Technical:** CloudFront edge requests and errors. **Customer:** Can shoppers reach the store? Distribution identifier inherited from original dashboard; verify after infrastructure recreation.",
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 5
          },
          "options": {
            "mode": "markdown",
            "content": "**Technical:** CloudFront edge requests and errors. **Customer:** Can shoppers reach the store? Distribution identifier inherited from original dashboard; verify after infrastructure recreation."
          }
        },
        {
          "id": 3,
          "title": "Edge requests",
          "type": "timeseries",
          "description": "All distribution requests, including assets.",
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "cloudwatch",
            "uid": "${cloudwatch_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "cloudwatch",
                "uid": "${cloudwatch_datasource}"
              },
              "region": "us-east-1",
              "namespace": "AWS/CloudFront",
              "metricName": "Requests",
              "dimensions": {
                "DistributionId": "${distribution_id}",
                "Region": "Global"
              },
              "statistic": "Sum",
              "period": "60",
              "metricQueryType": 0,
              "matchExact": true,
              "expression": "",
              "label": "Requests"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data — verify telemetry"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 4,
          "title": "Edge 5xx errors",
          "type": "timeseries",
          "description": "Edge server errors.",
          "gridPos": {
            "x": 12,
            "y": 10,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "cloudwatch",
            "uid": "${cloudwatch_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "cloudwatch",
                "uid": "${cloudwatch_datasource}"
              },
              "region": "us-east-1",
              "namespace": "AWS/CloudFront",
              "metricName": "5xxErrorRate",
              "dimensions": {
                "DistributionId": "${distribution_id}",
                "Region": "Global"
              },
              "statistic": "Average",
              "period": "60",
              "metricQueryType": 0,
              "matchExact": true,
              "expression": "",
              "label": "5xxErrorRate"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "No data — verify telemetry"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 5,
          "title": "02 — Browse products | Catalog",
          "type": "text",
          "description": "**Technical:** k6 GET /catalog, sampled p95 and failure rate, Catalog HPA and MySQL. **Customer:** Can shoppers browse quickly? Synthetic metrics do not measure real browser clicks; cache may bypass origin.",
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 24,
            "h": 5
          },
          "options": {
            "mode": "markdown",
            "content": "**Technical:** k6 GET /catalog, sampled p95 and failure rate, Catalog HPA and MySQL. **Customer:** Can shoppers browse quickly? Synthetic metrics do not measure real browser clicks; cache may bypass origin."
          }
        },
        {
          "id": 6,
          "title": "Catalog synthetic p95",
          "type": "timeseries",
          "description": "Sampled p95, not whole-run percentile. Target 500 ms.",
          "gridPos": {
            "x": 0,
            "y": 23,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
