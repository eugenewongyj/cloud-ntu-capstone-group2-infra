          "targets": [
            {
              "refId": "A",
              "expr": "1000 * max by(assessment_run,test_profile,assessment_phase)(k6_capstone_product_listing_duration_p95{project=\"Capstone\",namespace=\"retail-store\",assessment_run=~\"${assessment_run:regex}\"})",
              "legendFormat": "sampled p95",
              "range": true,
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
