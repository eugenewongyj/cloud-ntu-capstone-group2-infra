          "options": {
            "mode": "markdown",
            "content": "## NORMAL DAY → 11.11 FLASH SALE → RECOVERY\n**Production shopper URL:** `https://group2-shop.sctp-sandbox.com` → **CloudFront WAF** → protected **ALB WAF** → **EKS retail-store**. The ALB-origin URL returns HTTP 403 when accessed directly **by design**.\n\n**How to demo:** select `retail-store`, set time range covering **both** tests, choose `All` assessment runs and profiles. For a precise comparison, select one run at a time and preserve its time window. **The dashboard never fabricates purchases or capacity changes.** Missing metrics show **No data**, not zero.\n\n🟢 Green = within threshold · 🟠 Orange = degraded/approaching limit · 🔴 Red = threshold breached · **No data = telemetry not yet available**."
          }
