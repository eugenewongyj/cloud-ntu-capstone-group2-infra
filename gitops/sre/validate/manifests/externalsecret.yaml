apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: capstone-assessment-controller-auth
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: capstone-assessment-controller-auth
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: group2-capstone/sre/controller-auth
        property: token
