apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-assessment-controller
  namespace: monitoring
  labels:
    app.kubernetes.io/name: capstone-assessment-controller
    app.kubernetes.io/part-of: capstone-sre
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: capstone-assessment-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capstone-assessment-controller
        app.kubernetes.io/part-of: capstone-sre
    spec:
      serviceAccountName: capstone-assessment-controller
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 60

      nodeSelector:
        kubernetes.io/os: linux
        workload-tier: t3-medium-platform

      tolerations:
        - key: workload
          operator: Equal
          value: t3-medium-platform
          effect: NoSchedule

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: controller
          image: 255945442255.dkr.ecr.ap-southeast-1.amazonaws.com/group2-capstone-sre-controller@sha256:8cf847c6fffc30bcbf4548b8761b0a4881c6a910deb978011854e5002f15bc3f
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: CAPSTONE_MAX_BASE_USERS
              value: "1"

            - name: CAPSTONE_CONTROLLER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: capstone-assessment-controller-auth
                  key: token

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3

          volumeMounts:
            - name: temporary
              mountPath: /tmp

      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
