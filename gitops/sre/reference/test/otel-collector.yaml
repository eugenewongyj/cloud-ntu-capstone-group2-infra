apiVersion: v1
kind: ServiceAccount
metadata:
  name: swiftkart-collector-collector
  namespace: opentelemetry-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: swiftkart-collector
  namespace: opentelemetry-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  config: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      otlp:
        endpoint: "tempo.logging.svc.cluster.local:4317"
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp]
