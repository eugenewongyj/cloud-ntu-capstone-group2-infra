apiVersion: v1
kind: Namespace
metadata:
  name: opentelemetry-system
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: retail-store-collector
  namespace: opentelemetry-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: retail-store-collector
  namespace: opentelemetry-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  mode: deployment
  replicas: 1
  serviceAccount: retail-store-collector
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.114.0
  ports:
    - name: prometheus
      port: 8889
      targetPort: 8889
      protocol: TCP
  nodeSelector:
    workload-tier: t3-medium-logging
  tolerations:
    - key: workload
      operator: Equal
      value: t3-medium-logging
      effect: NoSchedule
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    connectors:
      spanmetrics:
        dimensions:
          - name: http.status_code
          - name: http.response.status_code
          - name: http.method
          - name: http.request.method
        histogram:
          explicit:
            buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s]
    exporters:
      otlp:
        endpoint: "tempo.logging.svc.cluster.local:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp, spanmetrics]
        metrics:
          receivers: [spanmetrics]
          processors: [batch]
          exporters: [prometheus]