apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: retail-store-instrumentation
  namespace: retail-store
  annotations:
    argocd.argoproj.io/sync-wave: "5" # Move to wave 5 so operator pod is 100% Ready first
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  exporter:
    endpoint: "http://retail-store-collector-collector.opentelemetry-system.svc.cluster.local:4318"
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_traceidratio
    argument: "1.0"
  env:
    - name: OTEL_METRICS_EXPORTER
      value: "otlp"
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: "http/protobuf"
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: "service.namespace=retail-store,deployment.environment.name=capstone"
  java:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.32.0
    env:
      - name: OTEL_METRICS_EXPORTER
        value: "otlp"
      - name: OTEL_LOGS_EXPORTER
        value: "none"
      - name: OTEL_RESOURCE_ATTRIBUTES
        value: "service.namespace=retail-store,deployment.environment.name=capstone"
  nodejs:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:0.82.0-1
    env:
      - name: OTEL_METRICS_EXPORTER
        value: "otlp"
      - name: OTEL_LOGS_EXPORTER
        value: "none"
      - name: OTEL_RESOURCE_ATTRIBUTES
        value: "service.namespace=retail-store,deployment.environment.name=capstone"