apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: swiftkart-instrumentation
  namespace: retail-store # Must match where your SwiftKart apps live
spec:
  exporter:
    endpoint: "http://swiftkart-collector-collector.opentelemetry-system.svc.cluster.local:4317"
  sampler:
    type: parentbased_traceidratio
    argument: "1.0" # Sample 100% of traces for the capstone demo