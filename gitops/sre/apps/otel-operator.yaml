apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-operator
  namespace: argocd
  annotations:
    # ── ADD THIS SYNC WAVE ──────────────────────────────
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: sre-project
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-operator
    targetRevision: 0.129.0 # Update to the latest stable chart version
    helm:
      valuesObject:
        crds:
          enabled: true # Let Helm handle CRDs and inject the webhook CA bundle
        # Instruct Helm to auto-generate a self-signed cert instead of requiring cert-manager
        admissionWebhooks:
          certManager:
            enabled: false
          autoGenerateCert:
            enabled: true
            
        # ADDED: Increase CPU limits and probe timeouts to prevent "context deadline exceeded"
        manager:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # livenessProbe:
          #   timeoutSeconds: 3
          # readinessProbe:
          #   timeoutSeconds: 3

  destination:
    server: https://kubernetes.default.svc
    namespace: opentelemetry-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # Recommended for large CRDs in Helm charts
  # Prevents ArgoCD from wiping out the auto-generated webhook CA bundle
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[].clientConfig.caBundle'
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[].clientConfig.caBundle'
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - '.spec.conversion.webhook.clientConfig.caBundle'