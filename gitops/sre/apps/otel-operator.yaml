apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-operator
  namespace: argocd
spec:
  project: sre-project
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-operator
    targetRevision: 0.129.0 # Update to the latest stable chart version
    helm:
      valuesObject:
        # Instruct Helm to auto-generate a self-signed cert instead of requiring cert-manager
        admissionWebhooks:
          certManager:
            enabled: false
          autoGenerateCert:
            enabled: true
            
        # ADDED: Increase CPU limits and probe timeouts to prevent "context deadline exceeded"
        manager:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            timeoutSeconds: 3
          readinessProbe:
            timeoutSeconds: 3

  destination:
    server: https://kubernetes.default.svc
    namespace: opentelemetry-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true