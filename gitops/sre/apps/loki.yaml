apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sre-project
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.5.0
    helm:
      valuesObject:
        deploymentMode: SimpleScalable

        global:
          extraEnv:
            - name: AWS_REGION
              value: ap-southeast-1
            - name: AWS_DEFAULT_REGION
              value: ap-southeast-1
            - name: AWS_ROLE_ARN
              value: arn:aws:iam::255945442255:role/group2-capstone-loki-s3-role
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/eks.amazonaws.com/serviceaccount/token
            - name: AWS_STS_REGIONAL_ENDPOINTS
              value: regional
          extraVolumes:
            - name: aws-iam-token
              projected:
                defaultMode: 420
                sources:
                  - serviceAccountToken:
                      audience: sts.amazonaws.com
                      expirationSeconds: 3600
                      path: token
          extraVolumeMounts:
            - name: aws-iam-token
              mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
              readOnly: true

        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1

          # Configure Loki to use AWS S3 directly
          storage:
            bucketNames:
              chunks: group2-capstone-loki-logs-ap-southeast-1
              ruler: group2-capstone-loki-logs-ap-southeast-1
              admin: group2-capstone-loki-logs-ap-southeast-1
            type: s3
            s3:
              region: ap-southeast-1
              s3ForcePathStyle: false

          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: index_
                  period: 24h

        # Disable the local MinIO sandbox
        minio:
          enabled: false

        serviceAccount:
          create: true
          name: loki
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::255945442255:role/group2-capstone-loki-s3-role

        chunksCache:
          enabled: false

        resultsCache:
          enabled: false

        gateway:
          nodeSelector:
            workload-tier: t3-medium-logging
          tolerations:
            - key: workload
              operator: Equal
              value: t3-medium-logging
              effect: NoSchedule

        lokiCanary:
          tolerations:
            - operator: Exists

        read:
          replicas: 1
          nodeSelector:
            workload-tier: t3-medium-logging
          tolerations:
            - key: workload
              operator: Equal
              value: t3-medium-logging
              effect: NoSchedule
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
        write:
          replicas: 1
          nodeSelector:
            workload-tier: t3-medium-logging
          tolerations:
            - key: workload
              operator: Equal
              value: t3-medium-logging
              effect: NoSchedule
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 384Mi
        backend:
          replicas: 1
          nodeSelector:
            workload-tier: t3-medium-logging
          tolerations:
            - key: workload
              operator: Equal
              value: t3-medium-logging
              effect: NoSchedule
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 384Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true