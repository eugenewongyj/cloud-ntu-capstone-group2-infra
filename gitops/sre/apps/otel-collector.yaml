apiVersion: v1
kind: ServiceAccount
metadata:
  name: swiftkart-collector-collector
  namespace: opentelemetry-system
---
apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: swiftkart-collector
  namespace: opentelemetry-system
spec:
  config: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      otlp:
        endpoint: "tempo.logging.svc.cluster.local:4317"
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp]
    ignoreDifferences:
    - group: opentelemetry.io
      kind: OpenTelemetryCollector
      jsonPointers:
        - /spec/config
    - group: ""
      kind: ServiceAccount
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id