apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sre-project
  sources:
    # 1. Pull the remote Helm chart from Prometheus Community
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.1.1
      helm:
        valueFiles:
          - $values/gitops/sre/apps/prometheus-stack-values.yaml
          - $values/gitops/sre/apps/grafana-dashboards.yaml
    # 2. Pull your values files from your GitHub repository (matching your 'gitops' folder structure)
    - repoURL: https://github.com/eugenewongyj/cloud-ntu-capstone-group2-infra.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true