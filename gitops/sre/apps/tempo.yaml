apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
spec:
  project: sre-project
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: tempo
    targetRevision: 3.2.1
    helm:
      valuesObject:
        nodeSelector:
          workload-tier: t3-medium-logging
        tolerations:
          - key: workload
            operator: Equal
            value: t3-medium-logging
            effect: NoSchedule

        serviceAccount:
          create: true
          name: tempo
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::255945442255:role/group2-capstone-tempo-s3-role

        extraVolumes:
          - name: aws-iam-token
            projected:
              defaultMode: 420
              sources:
                - serviceAccountToken:
                    audience: sts.amazonaws.com
                    expirationSeconds: 3600
                    path: token

        tempo:
          extraEnv:
            - name: AWS_REGION
              value: ap-southeast-1
            - name: AWS_DEFAULT_REGION
              value: ap-southeast-1
            - name: AWS_ROLE_ARN
              value: arn:aws:iam::255945442255:role/group2-capstone-tempo-s3-role
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/eks.amazonaws.com/serviceaccount/token
            - name: AWS_STS_REGIONAL_ENDPOINTS
              value: regional
          extraVolumeMounts:
            - name: aws-iam-token
              mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
              readOnly: true
          storage:
            trace:
              backend: s3
              s3:
                bucket: "group2-capstone-tempo-traces-ap-southeast-1"
                endpoint: "s3.ap-southeast-1.amazonaws.com"
                region: "ap-southeast-1"
                insecure: false
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true