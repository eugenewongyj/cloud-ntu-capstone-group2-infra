apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-adapter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4" # Deploy right after kube-prometheus-stack (wave 3)#
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sre-project
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-adapter
    targetRevision: 4.11.0
    helm:
      valuesObject:
        nodeSelector:
          workload-tier: t3-medium-monitoring
        tolerations:
          - key: workload
            operator: Equal
            value: t3-medium-monitoring
            effect: NoSchedule
        prometheus:
          # Points to your kube-prometheus-stack Prometheus service in the monitoring namespace
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local
          port: 9090
        rules:
          default: true
          # Exposes standard CPU & Memory metrics from Prometheus to the Kubernetes HPA API
          resource:
            cpu:
              containerQuery: |
                sum by (<<.GroupBy>>) (
                  rate(container_cpu_usage_seconds_total{container!="",<<.LabelMatchers>>}[3m])
                )
              nodeQuery: |
                sum by (<<.GroupBy>>) (
                  rate(node_cpu_seconds_total{mode!="idle",mode!="iowait",mode!="steal"}[3m])
                  * on(instance) group_left(node)
                  label_replace(kube_node_info{<<.LabelMatchers>>}, "instance", "$1:9100", "internal_ip", "(.*)")
                )
              resources:
                overrides:
                  node:
                    resource: node
                  namespace:
                    resource: namespace
                  pod:
                    resource: pod
              containerLabel: container
            memory:
              containerQuery: |
                sum by (<<.GroupBy>>) (
                  container_memory_working_set_bytes{container!="",<<.LabelMatchers>>}
                )
              nodeQuery: |
                sum by (<<.GroupBy>>) (
                  (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
                  * on(instance) group_left(node)
                  label_replace(kube_node_info{<<.LabelMatchers>>}, "instance", "$1:9100", "internal_ip", "(.*)")
                )
              resources:
                overrides:
                  node:
                    resource: node
                  namespace:
                    resource: namespace
                  pod:
                    resource: pod
              containerLabel: container
          window: 3m
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true