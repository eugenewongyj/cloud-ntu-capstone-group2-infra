apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: capstone-discord-routing
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  route:
    groupBy: ['namespace', 'severity']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    receiver: 'discord-notifications'
    routes:
      - matchers:
          - name: alertname
            value: Watchdog
            matchType: '='
        receiver: 'null-receiver'

      # 1. Trigger AWS DevOps Agent RCA within 10s, then continue to Discord
      - matchers:
          - name: severity
            value: critical
            matchType: '='
        groupBy: ['alertname', 'namespace', 'pod', 'deployment']
        groupWait: 10s
        groupInterval: 1m
        repeatInterval: 1h
        receiver: 'devops-agent-webhook'
        continue: true

      # 2. Send immediate Discord notification for critical alerts
      - matchers:
          - name: severity
            value: critical
            matchType: '='
        groupBy: ['namespace', 'alertname']
        groupWait: 10s
        repeatInterval: 1h
        receiver: 'discord-notifications'

  receivers:
    - name: 'null-receiver'
    - name: 'devops-agent-webhook'
      webhookConfigs:
        - urlSecret:
            name: devops-agent-webhook
            key: webhook-url
          sendResolved: true
    - name: 'discord-notifications'
      discordConfigs:
        - apiURL:
            name: sre-monitoring-discord-webhook
            key: url
          sendResolved: true
          title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.namespace }})'
          message: >-
            {{ range .Alerts }}
            **Severity:** `{{ .Labels.severity }}`
            **Summary:** {{ .Annotations.summary }}
            **Details:** {{ .Annotations.description }}
            {{ end }}