apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orders-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: app-staging-project
  source:
    repoURL: https://github.com/eugenewongyj/cloud-ntu-capstone-group2-app.git
    targetRevision: main
    path: src/orders/chart
    helm:
      releaseName: orders
      valuesObject:
        nodeSelector:
          workload-tier: t3-medium-apps-staging
        tolerations:
        - key: workload
          operator: Equal
          value: t3-medium-apps-staging
          effect: NoSchedule
        # Our own image from ECR (built + scanned by CI). Tag updated automatically by a PR from build-orders-checkout.yaml
        image:
          repository: 
            255945442255.dkr.ecr.ap-southeast-1.amazonaws.com/group2-capstone-orders
          tag: "391c872f88991ca610ea554f7a56d8880a620f7b"
        # Service account name must match the STAGING Pod Identity association (staging-orders-checkout.tf)
        serviceAccount:
          create: true
          name: orders
        app:
          # STAGING queue: the staging IAM role can only send here, never to the prod queue
          messaging:
            provider: sqs
            sqs:
              topic: group2-capstone-orders-events-staging
              region: ap-southeast-1
            rabbitmq:
              secret:
                create: false   # not using RabbitMQ: don't create an empty secret
          # STAGING Aurora PostgreSQL (staging-orders-checkout.tf): separate from prod data
          persistence:
            provider: postgres
            endpoint: "group2-capstone-orders-pg-staging.cluster-cnge2fzfx0rs.ap-southeast-1.rds.amazonaws.com:5432"
            database: orders
            secret:
              create: false     # credentials come from External Secrets (gitops/app-staging/manifests/orders-db-staging)
              name: orders-db
        # Add the OTel instrumentation annotation here
        podAnnotations:
          # Change "-java" to "-nodejs", "-python", or "-go" if your UI is built with a different language
          instrumentation.opentelemetry.io/inject-java: "retail-store-instrumentation"
        # Set the Pod Size (Requests and Limits)
        resources:
          requests:
            cpu: 250m
            memory: 384Mi
          limits:
            cpu: 1000m
            memory: 768Mi
        autoscaling:
          enabled: true
          minReplicas: 1
          maxReplicas: 3
          targetCPUUtilizationPercentage: 70
        # Add this block to enable Prometheus scraping
        metrics:
          enabled: true
        serviceMonitor:
          enabled: true
          # This label is critical: it tells Prometheus to pick up this monitor
          additionalLabels:
            release: kube-prometheus-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: retail-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
