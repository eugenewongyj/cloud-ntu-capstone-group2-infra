apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: checkout-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: app-staging-project
  source:
    repoURL: https://github.com/eugenewongyj/cloud-ntu-capstone-group2-app.git
    targetRevision: main
    path: src/checkout/chart
    helm:
      releaseName: checkout
      valuesObject:
        nodeSelector:
          workload-tier: t3-medium-apps-staging
        tolerations:
          - key: workload
            operator: Equal
            value: t3-medium-apps-staging
            effect: NoSchedule
        # Our own image from ECR (built + scanned by CI). Tag updated automatically by a PR from build-orders-checkout.yaml
        image:
          repository: 255945442255.dkr.ecr.ap-southeast-1.amazonaws.com/group2-capstone-checkout
          tag: "5641ed5f5ed2ce4991149e9507e497ab80366fa1"
        app:
          # orders = the orders service in retail-staging (same namespace), not prod
          endpoints:
            orders: http://orders:80
          # STAGING Valkey cache (staging-orders-checkout.tf): separate from prod sessions
          persistence:
            provider: redis
            redis:
              endpoint: "group2-capstone-checkout-staging-gc2iuw.serverless.apse1.cache.amazonaws.com:6379"
              tls: true   # Serverless always requires TLS (rediss://)
        # Add the OTel instrumentation annotation here
        podAnnotations:
          # Change "-java" to "-nodejs", "-python", or "-go" if your UI is built with a different language
          instrumentation.opentelemetry.io/inject-nodejs: "retail-store-instrumentation"
        # Set the Pod Size (Requests and Limits)
        resources:
          requests:
            cpu: 125m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 512Mi
        autoscaling:
          enabled: true
          minReplicas: 1
          maxReplicas: 3
          targetCPUUtilizationPercentage: 70
        # Add this block to enable Prometheus scraping
        metrics:
          enabled: true
        serviceMonitor:
          enabled: true
          # This label is critical: it tells Prometheus to pick up this monitor
          additionalLabels:
            release: kube-prometheus-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: retail-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas