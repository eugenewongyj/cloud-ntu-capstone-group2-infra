apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalog-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: app-staging-project

  source:
    repoURL: https://github.com/eugenewongyj/cloud-ntu-capstone-group2-app.git
    targetRevision: main
    path: src/catalog/chart
    helm:
      releaseName: catalog
      valuesObject:
        nodeSelector:
          workload-tier: t3-medium-apps-staging
        tolerations:
          - key: workload
            operator: Equal
            value: t3-medium-apps-staging
            effect: NoSchedule
        # Aurora MySQL Serverless v2 (aurora-mysql.tf) instead of in-memory:
        # products live in a managed database shared by all replicas.
        # Same approach as orders -> Aurora PostgreSQL.
        #app:
          #persistence:
            #provider: mysql
            #endpoint: "group2-capstone-aurora-mysql.cluster-cnge2fzfx0rs.ap-southeast-1.rds.amazonaws.com:3306"
            #database: Catalog   # created by aurora-mysql.tf (var.aurora_db_name, capital C)
            #secret:
              #create: false     # credentials come from External Secrets (gitops/app/manifests/catalog-db)
              #name: catalog-db
        # Add the OTel instrumentation annotation here
        podAnnotations:
          # Change "-java" to "-nodejs", "-python", or "-go" if your UI is built with a different language
          instrumentation.opentelemetry.io/inject-sdk: "retail-store-instrumentation"
        # Set the Pod Size (Requests and Limits)
        resources:
          requests:
            cpu: 125m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 512Mi
        autoscaling:
          enabled: true
          minReplicas: 1
          maxReplicas: 3
          targetCPUUtilizationPercentage: 70
        # Add this block to enable Prometheus scraping
        metrics:
          enabled: true
        serviceMonitor:
          enabled: true
          # This label is critical: it tells Prometheus to pick up this monitor
          additionalLabels:
            release: kube-prometheus-stack

  destination:
    server: https://kubernetes.default.svc
    namespace: retail-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas