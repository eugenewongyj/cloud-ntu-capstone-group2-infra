apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: ui-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"

spec:
  project: app-staging-project

  source:
    repoURL: https://github.com/eugenewongyj/cloud-ntu-capstone-group2-app.git
    targetRevision: main
    path: src/ui/chart

    helm:
      releaseName: ui
      valuesObject:
        nodeSelector:
          workload-tier: t3-medium-apps-staging
        tolerations:
          - key: workload
            operator: Equal
            value: t3-medium-apps-staging
            effect: NoSchedule
        # Add the OTel instrumentation annotation here
        podAnnotations:
          # Change "-java" to "-nodejs", "-python", or "-go" if your UI is built with a different language
          instrumentation.opentelemetry.io/inject-java: "retail-store-instrumentation"

        # Custom-built UI image in ECR
        image:
          repository: 
            255945442255.dkr.ecr.ap-southeast-1.amazonaws.com/group2-capstone-ui
          tag: "e03aed5a50f60aa8d1096a3bd60f6ee094ddfb1d"
          pullPolicy: IfNotPresent

        # Single replica for initial staging
        replicaCount: 1

        autoscaling:
          enabled: true
          minReplicas: 1
          maxReplicas: 3
          targetCPUUtilizationPercentage: 70

        # Keep the existing resource requirements
        resources:
          requests:
            cpu: 250m
            memory: 384Mi
          limits:
            cpu: 1000m
            memory: 768Mi

        # Disable public ingress initially
        ingress:
          enabled: false

        # Disable optional monitoring initially
        serviceMonitor:
          enabled: false

        # Connect to existing catalog/cart services
        #app:
          #endpoints:
            #catalog: http://catalog.retail-store.svc.cluster.local:80
            #carts: http://carts.retail-store.svc.cluster.local:80

  destination:
    server: https://kubernetes.default.svc
    namespace: retail-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
