apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: ui-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    notifications.argoproj.io/subscribe.on-ui-staging-validated.github-dispatch: ""

spec:
  project: app-staging-project

  source:
    repoURL: https://github.com/eugenewongyj/cloud-ntu-capstone-group2-app.git
    targetRevision: main
    path: src/ui/chart

    helm:
      releaseName: ui
      valuesObject:
        nodeSelector:
          workload-tier: t3-medium-apps-staging
        tolerations:
        - key: workload
          operator: Equal
          value: t3-medium-apps-staging
          effect: NoSchedule
        # Add the OTel instrumentation annotation here
        podAnnotations:
          # Change "-java" to "-nodejs", "-python", or "-go" if your UI is built with a different language
          instrumentation.opentelemetry.io/inject-java: "retail-store-instrumentation"

        # Custom-built UI image in ECR
        image:
          repository: 
            255945442255.dkr.ecr.ap-southeast-1.amazonaws.com/group2-capstone-ui
          tag: "5979c916c5e0b812f2fd1941ae81b29f4b0a71ee"
          pullPolicy: IfNotPresent

        # Single replica for initial staging
        replicaCount: 1

        autoscaling:
          enabled: true
          minReplicas: 1
          maxReplicas: 3
          targetCPUUtilizationPercentage: 70

        # Keep the existing resource requirements
        resources:
          requests:
            cpu: 250m
            memory: 384Mi
          limits:
            cpu: 1000m
            memory: 768Mi

        # Disable public ingress initially
        ingress:
          enabled: true
          className: alb
          annotations:
            alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
            alb.ingress.kubernetes.io/ssl-redirect: "443"
            # Attach the WAF by NAME (from waf.tf), not ARN: the ARN changes on every daily rebuild
            #alb.ingress.kubernetes.io/wafv2-acl-name: group2-capstone-web-acl
          hosts:
          - group2-retail-staging.sctp-sandbox.com
          tls: []

        # Disable optional monitoring initially
        serviceMonitor:
          enabled: false

        # Connect to existing catalog/cart services
        app:
          endpoints:
            catalog: http://catalog:80
            carts: http://carts:80

        smokeTest:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: retail-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
