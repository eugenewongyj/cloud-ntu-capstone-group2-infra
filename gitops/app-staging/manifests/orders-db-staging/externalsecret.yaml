# STAGING: creates the K8s Secret "orders-db" in retail-staging from the
# AWS-managed password of the STAGING Aurora cluster (orders-pg-staging).
# Same pattern as gitops/app/manifests/orders-db, different cluster + namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-db
  namespace: retail-staging
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: aws-secrets-manager          # shared ClusterSecretStore (gitops/sec/manifests/external-secrets)
    kind: ClusterSecretStore
  dataFrom:
    - find:
        tags:
          "aws:rds:primaryDBClusterArn": "arn:aws:rds:ap-southeast-1:255945442255:cluster:group2-capstone-orders-pg-staging"
          "environment": "staging"
      rewrite:
        - regexp:
            source: ".*"
            target: "creds"
  target:
    name: orders-db                    # the name the orders chart expects
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RETAIL_ORDERS_PERSISTENCE_USERNAME: '{{ (.creds | fromJson).username }}'
        RETAIL_ORDERS_PERSISTENCE_PASSWORD: '{{ (.creds | fromJson).password }}'
