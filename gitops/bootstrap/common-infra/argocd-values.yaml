global:
  priorityClassName: platform-critical
  nodeSelector:
    workload-tier: t3-medium-platform
  tolerations:
    - key: workload
      operator: Equal
      value: t3-medium-platform
      effect: NoSchedule
server:
  extraArgs:
    - --insecure
  ingress:
    enabled: false
notifications:
  secret:
    create: false