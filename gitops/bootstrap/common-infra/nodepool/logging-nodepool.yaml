apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: t3-medium-logging-nodepool
spec:
  template:
    metadata:
      labels:
        workload-tier: t3-medium-logging
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: default
      taints:
        - key: workload
          value: t3-medium-logging
          effect: NoSchedule
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - t3.medium
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
  limits:
    cpu: "6"
    memory: 12Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s