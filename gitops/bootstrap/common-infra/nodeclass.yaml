apiVersion: eks.amazonaws.com/v1
kind: NodeClass
metadata:
  name: default
spec:
  role: group2-capstone-cluster-node-role
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: group2-capstone-cluster
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: group2-capstone-cluster
  ephemeralStorage:
    size: 40Gi
    iops: 3000
    throughput: 125