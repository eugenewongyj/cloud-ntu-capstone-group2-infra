apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cart
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: app-project

  source:
    repoURL: https://github.com/eugenewongyj/cloud-ntu-capstone-group2-app.git
    targetRevision: main
    path: src/cart/chart
    helm:
      releaseName: cart
      parameters:
        - name: fullnameOverride
          value: carts
      valuesObject:
        nodeSelector:
          workload-tier: t3-medium-apps
        tolerations:
          - key: workload
            operator: Equal
            value: t3-medium-apps
            effect: NoSchedule
        # Service account name must match the Pod Identity association in dynamodb-dax.tf
        # (var.cart_service_account = "cart-carts"): gives the pod short-lived AWS credentials
        serviceAccount:
          create: true
          name: cart-carts
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::255945442255:role/group2-capstone-cart-pod-role
        # Settings come from our own ConfigMap "cart-config" (gitops/app/manifests/cart-config):
        # DynamoDB table + AWS_REGION. The chart has no region setting, and Pod Identity
        # provides credentials but not the region.
        configMap:
          create: false
          name: cart-config
      # Add the OTel instrumentation annotation here
        podAnnotations:
          # Change "-java" to "-nodejs", "-python", or "-go" if your UI is built with a different language
          instrumentation.opentelemetry.io/inject-java: "retail-store-instrumentation"
        # Set the Pod Size (Requests and Limits)
        resources:
          requests:
            cpu: 250m
            memory: 384Mi
          limits:
            cpu: 1000m
            memory: 768Mi
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 6
          targetCPUUtilizationPercentage: 70
        topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: carts
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
        # Add this block to enable Prometheus scraping
        metrics:
          enabled: true
        serviceMonitor:
          enabled: true
          # This label is critical: it tells Prometheus to pick up this monitor
          additionalLabels:
            release: kube-prometheus-stack

  destination:
    server: https://kubernetes.default.svc
    namespace: retail-store
    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas