apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ui
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: app-project
  source:
    repoURL: https://github.com/eugenewongyj/cloud-ntu-capstone-group2-app.git
    targetRevision: main
    path: src/ui/chart
    helm:
      releaseName: ui
      valuesObject:
        nodeSelector:
          workload-tier: t3-medium-apps
        tolerations:
        - key: workload
          operator: Equal
          value: t3-medium-apps
          effect: NoSchedule
        # Add the OTel instrumentation annotation here
        podAnnotations:
          # Change "-java" to "-nodejs", "-python", or "-go" if your UI is built with a different language
          instrumentation.opentelemetry.io/inject-java: "retail-store-instrumentation"
        # Set the Pod Size (Requests and Limits)
        resources:
          requests:
            cpu: 250m
            memory: 384Mi
          limits:
            cpu: 1000m
            memory: 768Mi
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 6
          targetCPUUtilizationPercentage: 70
        topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ui
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
          maxUnavailable:
        # Add this block to enable Prometheus scraping
        metrics:
          enabled: true
        serviceMonitor:
          enabled: true
          # This label is critical: it tells Prometheus to pick up this monitor
          additionalLabels:
            release: kube-prometheus-stack
        ingress:
          enabled: true
          className: alb
          annotations:
            alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
            alb.ingress.kubernetes.io/ssl-redirect: "443"
            # Attach the WAF by NAME (from waf.tf), not ARN: the ARN changes on every daily rebuild
            alb.ingress.kubernetes.io/wafv2-acl-name: group2-capstone-web-acl
          hosts:
          - group2-retail.sctp-sandbox.com
          tls: []
        app:
          endpoints:
            catalog: http://catalog:80
            carts: http://carts:80
            checkout: http://checkout:80   # real checkout service (without this the UI uses a built-in fake checkout)
            orders: http://orders:80
        image:
          repository: 
            255945442255.dkr.ecr.ap-southeast-1.amazonaws.com/group2-capstone-ui
          tag: "c50adc8584bec986d5c1054d372a6b3dcfa82f18"
          pullPolicy: IfNotPresent
  destination:
    server: https://kubernetes.default.svc
    namespace: retail-store
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
