# Creates the K8s Secret "catalog-db" from the AWS-managed Aurora MySQL password.
# Same approach as orders-db. The RDS secret name changes on every rebuild, so we find it by its stable tag.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalog-db
  namespace: retail-store
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: aws-secrets-manager          # shared ClusterSecretStore (gitops/sec/manifests/external-secrets)
    kind: ClusterSecretStore
  dataFrom:
    - find:
        tags:
          "aws:rds:primaryDBClusterArn": "arn:aws:rds:ap-southeast-1:255945442255:cluster:group2-capstone-aurora-mysql"
      rewrite:
        - regexp:
            source: ".*"               # the found secret's name (rds!cluster-...) ...
            target: "creds"            # ... renamed to a fixed key we can use below
  target:
    name: catalog-db                   # the name set in gitops/app/apps/catalog.yaml (persistence.secret.name)
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RETAIL_CATALOG_PERSISTENCE_USER: '{{ (.creds | fromJson).username }}'
        # The catalog app's config reader treats "$abc" in a value as a variable and
        # replaces it, which breaks AWS-generated passwords that contain "$".
        # Writing "$" as "$$" makes the app turn it back into a single "$".
        RETAIL_CATALOG_PERSISTENCE_PASSWORD: '{{ (.creds | fromJson).password | replace "$" "$$" }}'