# Creates the K8s Secret "orders-db" from the AWS-managed Aurora password.
# The RDS secret name changes on every rebuild, so we find it by its stable tag.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-db
  namespace: retail-store
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: aws-secrets-manager          # shared ClusterSecretStore (gitops/sec/manifests/external-secrets)
    kind: ClusterSecretStore
  dataFrom:
    - find:
        tags:
          "aws:rds:primaryDBClusterArn": "arn:aws:rds:ap-southeast-1:255945442255:cluster:group2-capstone-orders-pg"
      rewrite:
        - regexp:
            source: ".*"               # the found secret's name (rds!cluster-...) ...
            target: "creds"            # ... renamed to a fixed key we can use below
  target:
    name: orders-db                    # the name the orders chart expects
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RETAIL_ORDERS_PERSISTENCE_USERNAME: '{{ (.creds | fromJson).username }}'
        RETAIL_ORDERS_PERSISTENCE_PASSWORD: '{{ (.creds | fromJson).password }}'