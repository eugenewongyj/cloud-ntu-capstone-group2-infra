apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra-project
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.17.1
    helm:
      valuesObject:
        global:
          priorityClassName: platform-critical
          nodeSelector:
            workload-tier: t3-medium-platform
          tolerations:
            - key: workload
              operator: Equal
              value: t3-medium-platform
              effect: NoSchedule
        controller:
          replicas: 2
          pdb:
            enabled: true
            minAvailable: 1
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 1.5Gi
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: prometheus
                    topologyKey: kubernetes.io/hostname
          readinessProbe:
            timeoutSeconds: 5
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            timeoutSeconds: 5
            periodSeconds: 15
            failureThreshold: 5
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: kube-prometheus-stack
        server:
          replicas: 2
          pdb:
            enabled: true
            minAvailable: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            timeoutSeconds: 5
            periodSeconds: 15
          livenessProbe:
            timeoutSeconds: 5
            periodSeconds: 15
          extraArgs:
            - --insecure
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: kube-prometheus-stack
        repoServer:
          replicas: 2
          pdb:
            enabled: true
            minAvailable: 1
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: kube-prometheus-stack
        applicationSet:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: kube-prometheus-stack
        notifications:
          enabled: true

          secret:
            create: false

          notifiers:
            service.webhook.github-dispatch: |
              url: https://api.github.com
              headers:
                - name: Authorization
                  value: Bearer $github-dispatch-token
                - name: Accept
                  value: application/vnd.github+json
                - name: Content-Type
                  value: application/json

          triggers:
            trigger.on-ui-staging-validated: |
              - description: UI staging deployment and smoke test succeeded
                oncePer: app.status.operationState.finishedAt
                send:
                  - ui-staging-validated
                when: >-
                  app.metadata.name == 'ui-staging' and
                  app.spec.destination.namespace == 'retail-staging' and
                  app.status.operationState?.phase == 'Succeeded' and
                  any(app.status.operationState.syncResult?.resources ?? [], {
                    #.kind == 'Job' and
                    #.name == 'ui-smoke-test' and
                    #.namespace == 'retail-staging' and
                    #.syncPhase == 'PostSync' and
                    #.hookPhase == 'Succeeded'
                  }) and
                  app.status.operationState.syncResult.source?.helm?.valuesObject?.image?.repository ==
                    '255945442255.dkr.ecr.ap-southeast-1.amazonaws.com/group2-capstone-ui' and
                  (app.status.operationState.syncResult.source?.helm?.valuesObject?.image?.tag ?? '')
                    matches '^[0-9a-f]{40}$'

          templates:
            template.ui-staging-validated: |
              webhook:
                github-dispatch:
                  method: POST
                  path: /repos/eugenewongyj/cloud-ntu-capstone-group2-app/dispatches
                  body: |
                    {
                      "event_type": "ui-staging-validated",
                      "client_payload": {
                        "application": "{{ .app.metadata.name }}",
                        "namespace": "{{ .app.spec.destination.namespace }}",
                        "image_repository": "{{ .app.status.operationState.syncResult.source.helm.valuesObject.image.repository }}",
                        "image_tag": "{{ .app.status.operationState.syncResult.source.helm.valuesObject.image.tag }}",
                        "chart_revision": "{{ .app.status.operationState.syncResult.revision }}",
                        "sync_finished_at": "{{ .app.status.operationState.finishedAt }}",
                        "sync_phase": "{{ .app.status.operationState.phase }}"
                      }
                    }
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true