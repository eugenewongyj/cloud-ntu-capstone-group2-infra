apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra-project
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.17.1
    helm:
      valuesObject:
        global:
          priorityClassName: platform-critical
          nodeSelector:
            workload-tier: t3-medium-platform
          tolerations:
            - key: workload
              operator: Equal
              value: t3-medium-platform
              effect: NoSchedule
        controller:
          replicas: 2
          pdb:
            enabled: true
            minAvailable: 1
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 1.5Gi
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: prometheus
                    topologyKey: kubernetes.io/hostname
          readinessProbe:
            timeoutSeconds: 5
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            timeoutSeconds: 5
            periodSeconds: 15
            failureThreshold: 5
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: kube-prometheus-stack
        server:
          replicas: 2
          pdb:
            enabled: true
            minAvailable: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            timeoutSeconds: 5
            periodSeconds: 15
          livenessProbe:
            timeoutSeconds: 5
            periodSeconds: 15
          extraArgs:
            - --insecure
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: kube-prometheus-stack
        repoServer:
          replicas: 2
          pdb:
            enabled: true
            minAvailable: 1
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: kube-prometheus-stack
        applicationSet:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: kube-prometheus-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true