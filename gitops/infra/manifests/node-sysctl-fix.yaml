##To ensure worker nodes never drop AWS NLB health checks on reboot or AMI rollout
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-sysctl-fix
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: node-sysctl-fix
  template:
    metadata:
      labels:
        name: node-sysctl-fix
    spec:
      hostNetwork: true
      hostPID: true
      initContainers:
        - name: set-rp-filter
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              sysctl -w net.ipv4.conf.all.rp_filter=2
              sysctl -w net.ipv4.conf.eth0.rp_filter=2
          securityContext:
            privileged: true
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9s