apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: alb
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  scheme: internet-facing
  targetType: ip
  # All Ingresses using the "alb" class share ONE load balancer
  # (shop, Argo CD, Grafana, Prometheus) instead of one each.
  group:
    name: group2-shared
