apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: assign-retail-priority-classes
spec:
  failurePolicy: Ignore
  rules:
    - name: prod-critical-retail-store
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["retail-store"]
              operations: ["CREATE"]
      mutate:
        patchStrategicMerge:
          spec:
            priorityClassName: prod-critical
            priority: null
    - name: staging-low-retail-staging
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["retail-staging"]
              operations: ["CREATE"]
      mutate:
        patchStrategicMerge:
          spec:
            priorityClassName: staging-low
            priority: null