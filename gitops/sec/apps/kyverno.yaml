apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sec-project
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.9.2
    helm:
      valuesObject:
        admissionController:
          replicas: 3
        backgroundController:
          replicas: 2
        serviceMonitor:
          enabled: true
          additionalLabels:
            release: kube-prometheus-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # Required for Kyverno's large CRDs
  ignoreDifferences:
    # Prevents Argo CD from infinitely syncing dynamically aggregated roles
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: 'kyverno:*'
      jqPathExpressions:
        - .rules