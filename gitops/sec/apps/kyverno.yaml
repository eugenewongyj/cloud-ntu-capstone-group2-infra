apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sec-project
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.9.2
    helm:
      valuesObject:
        config:
          preserve: false
        admissionController:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: kube-prometheus-stack
        backgroundController:
          replicas: 1
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: kube-prometheus-stack
        reportsController:
          replicas: 1
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: kube-prometheus-stack
        cleanupController:
          replicas: 1
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: kube-prometheus-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # Required for Kyverno's large CRDs
  ignoreDifferences:
    # Prevents ArgoCD from infinitely syncing dynamically aggregated ClusterRoles
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      jqPathExpressions:
        - .rules