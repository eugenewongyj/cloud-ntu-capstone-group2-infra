apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sec-project
  source:
    repoURL: https://aquasecurity.github.io/helm-charts/
    chart: trivy-operator
    targetRevision: 0.38.1
    helm:
      valuesObject:
        nodeSelector:
          workload-tier: t3-medium-security
        tolerations:
          - key: workload
            operator: Equal
            value: t3-medium-security
            effect: NoSchedule
        operator:
          nodeCollector:
            enabled: false
          scanJobTolerations:
            - operator: Exists
        # Ignore vulnerabilities that do not have a known fix yet to reduce noise
        trivy:
          ignoreUnfixed: true
        # Send vulnerability metrics to Prometheus
        serviceMonitor:
          enabled: true
          labels:
            release: kube-prometheus-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true