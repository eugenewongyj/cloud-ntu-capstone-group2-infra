apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"   # install before the apps (wave 6)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sec-project
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.15.0              # latest from helm search (19 Nov)
    helm:
      valuesObject:
        installCRDs: true               # installs the ExternalSecret / SecretStore resource types
        serviceAccount:
          name: external-secrets        # must match the Pod Identity association in Terraform
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true            # Argo creates the external-secrets namespace
      - ServerSideApply=true            # needed because ESO's CRDs are very large