apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"   # install before the apps (wave 6)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sec-project
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.15.0            # latest from helm search (19 Nov)
      helm:
        valuesObject:
          installCRDs: true
          crds:
            conversion:
              enabled: false          # installs the ExternalSecret / SecretStore resource types
          serviceAccount:
            name: external-secrets      # must match the Pod Identity association in Terraform
    - repoURL: https://github.com/eugenewongyj/cloud-ntu-capstone-group2-infra.git
      targetRevision: main
      path: gitops/sec/manifests/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true          # Argo creates the external-secrets namespace
      - ServerSideApply=true          # needed because ESO's CRDs are very large
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion
        - .status