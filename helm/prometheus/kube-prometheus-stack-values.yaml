grafana:
  adminPassword: "AdminSecurePass2026!"
  persistence:
    enabled: true
    storageClassName: "gp3" # Set explicitly for EKS Auto Mode
    size: 10Gi
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.loki.svc.cluster.local:3100
      access: proxy

prometheus:
  prometheusSpec:
    replicas: 1
    retention: 14d
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "gp3" # Set explicitly for Prometheus as well
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

alertmanager:
  alertmanagerSpec:
    replicas: 1
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: "gp3" # Set explicitly for Alertmanager
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi