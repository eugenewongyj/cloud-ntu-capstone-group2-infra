name: Terraform State RM
run-name: Running Terraform State RM by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      resource_address:
        description: 'Terraform resource address to remove (e.g., aws_opensearchserverless_vpc_endpoint.catalog)'
        required: true
        type: string

permissions:
  id-token: write       # Required for OIDC
  contents: read        # To read repo content

jobs:
  State-RM:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.OIDC_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init

      - name: Execute State Removal
        run: |
          echo "Removing resource from state: ${{ github.event.inputs.resource_address }}"
          terraform state rm "${{ github.event.inputs.resource_address }}"