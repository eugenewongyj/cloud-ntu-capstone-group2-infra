name: Fix Terraform State Drift

on:
  workflow_dispatch:
    inputs:
      resource_address:
        description: 'Terraform resource address to remove (e.g., aws_opensearchserverless_vpc_endpoint.catalog)'
        required: true
        type: string

jobs:
    state-maintenance:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0 # Match your project version

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_ROLE_ARN }} # Your OIDC deployment role ARN
          aws-region: ap-southeast-1

      - name: Terraform Init
        run: terraform init

      - name: Execute State Removal
        run: |
          echo "Removing resource from state: ${{ github.event.inputs.resource_address }}"
          terraform state rm "${{ github.event.inputs.resource_address }}"