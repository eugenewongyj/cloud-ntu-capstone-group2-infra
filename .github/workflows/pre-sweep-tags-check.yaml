name: Pre-Sweep Tag Guard (05:30 SGT)

on:
  schedule:
    - cron: '30 21 * * *' # 05:30 AM Asia/Singapore (30 mins before 06:00 AM teardown)
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  audit-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.OIDC_ROLE }}
          aws-region: ap-southeast-1

      - name: Auto-Tag Cluster-Owned Untagged Resources & Alert
        run: |
          TAGGED_COUNT=$(aws resourcegroupstaggingapi get-resources \
            --region ap-southeast-1 \
            --tag-filters "Key=Project,Values=capstone-project-group-02" \
            --query "length(ResourceTagMappingList)" \
            --output text)

          UNTAGGED_ARNS=$(aws resourcegroupstaggingapi get-resources \
            --region ap-southeast-1 \
            --query "ResourceTagMappingList[?!Tags[?Key=='Project'] && (Tags[?Key=='kubernetes.io/cluster/group2-capstone-cluster'] || contains(ResourceARN, 'group2-capstone'))].ResourceARN" \
            --output text)

          echo "## 🛡️ Pre-Sweep Tag Guard Report (05:30 SGT)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Verified Tagged Resources (`Project=capstone-project-group-02`):** ${TAGGED_COUNT}" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$UNTAGGED_ARNS" ]; then
            echo "- **Status:** ⚠️ Auto-tagged untagged cluster resources before 06:00 SGT sweep:" >> "$GITHUB_STEP_SUMMARY"
            for arn in $UNTAGGED_ARNS; do
              echo "  - \`${arn}\`" >> "$GITHUB_STEP_SUMMARY"
            done
            aws resourcegroupstaggingapi tag-resources \
              --region ap-southeast-1 \
              --resource-arn-list $UNTAGGED_ARNS \
              --tags Project=capstone-project-group-02,ManagedBy=TagGuard
          else
            echo "- **Status:** ✅ All cluster-owned resources already carry \`Project=capstone-project-group-02\`." >> "$GITHUB_STEP_SUMMARY"
          fi