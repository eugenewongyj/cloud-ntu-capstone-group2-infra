apiVersion: v1
data:
  capstone-health.json: |
    {
      "title": "SwiftKart \u2014 SRE Health Dashboard",
      "uid": "swiftkart-sre-health",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "title": "Prometheus Scrape Availability",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "up{namespace=\"default\"}",
              "refId": "A",
              "legendFormat": "{{namespace}} / {{pod}} / {{deployment}} / {{instance}}"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 2,
          "title": "Available Deployment Replicas",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{namespace=\"default\"}",
              "refId": "A",
              "legendFormat": "{{namespace}} / {{pod}} / {{deployment}} / {{instance}}"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          }
        },
        {
          "id": 3,
          "title": "Desired Deployment Replicas",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "kube_deployment_spec_replicas{namespace=\"default\"}",
              "refId": "A",
              "legendFormat": "{{namespace}} / {{pod}} / {{deployment}} / {{instance}}"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          }
        },
        {
          "id": 4,
          "title": "Container Restarts",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "kube_pod_container_status_restarts_total{namespace=\"default\"}",
              "refId": "A",
              "legendFormat": "{{namespace}} / {{pod}} / {{deployment}} / {{instance}}"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          }
        },
        {
          "id": 5,
          "title": "Pod Readiness",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "kube_pod_status_ready{namespace=\"default\",condition=\"true\"}",
              "refId": "A",
              "legendFormat": "{{namespace}} / {{pod}} / {{deployment}} / {{instance}}"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          }
        }
      ]
    }
kind: ConfigMap
metadata:
  labels:
    grafana_dashboard: "1"
  name: swiftkart-sre-dashboard
  namespace: capstone-monitoring
