
# Grafana Alloy Helm values for Capstone SRE logging.

controller:                         # Defines how Alloy runs in Kubernetes.
  type: deployment                  # Uses one Deployment instead of a node-level DaemonSet.
  replicas: 1                       # Runs one collector for the initial capstone demonstration.

rbac:                               # Controls Kubernetes API permissions.
  create: true                      # Creates the chart's default RBAC resources.

alloy:                              # Configures the Alloy application.
  clustering:                       # Controls distributed collection.
    enabled: false                  # No collector clustering is needed with one replica.

  configMap:                        # Stores the Alloy configuration.
    create: true                    # Helm creates the configuration ConfigMap.
    content: |-                     # Alloy configuration uses River syntax, not YAML.

      discovery.kubernetes "capstone_pods" {
        role = "pod"                // Discovers Kubernetes Pods.
        namespaces {
          names = ["default"]       // Restricts discovery to the expected application namespace.
        }
      }

      discovery.relabel "capstone_pods" {
        targets = discovery.kubernetes.capstone_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_owner"]
          regex = "retail-store-sample"
          action = "keep"          // Collects only Pods with the expected Retail Store owner label.
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label = "container"
        }
      }

      loki.source.kubernetes "capstone_logs" {
        targets    = discovery.relabel.capstone_pods.output
        forward_to = [loki.write.capstone.receiver]
      }

      loki.write "capstone" {
        endpoint {
          url = "http://capstone-loki-gateway.capstone-monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }
